name: R92 bootstrap npm lockfile once
on:
  push:
    branches:
      - fix/r92-reproducible-npm-lockfile
permissions:
  contents: write
jobs:
  generate-lockfile:
    if: "!contains(github.event.head_commit.message, '[r92-lock-generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate real npm v10 lockfile from the approved existing package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check lock is valid and performs a completely clean reproducible install
        run: |
          test -s package-lock.json
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:math
      - name: Commit generated lockfile to this one-time maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "R92: generate verified npm dependency lock [r92-lock-generated]"
            git push origin HEAD:fix/r92-reproducible-npm-lockfile
          fi
