name: R104 visual and motion regression
on:
  pull_request:
    paths:
      - 'src/styles/ui-v4.css'
      - 'src/components/Layout.astro'
      - 'src/pages/index.astro'
      - 'scripts/qa-r104-ui.mjs'
      - '.github/workflows/r104-ui.yml'
  push:
    branches: [main]
    paths:
      - 'src/styles/ui-v4.css'
      - 'src/components/Layout.astro'
      - 'src/pages/index.astro'
      - 'scripts/qa-r104-ui.mjs'
      - '.github/workflows/r104-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check real Chromium layout, reduced motion, 51 routes and keyboard-safe controls
        run: node scripts/qa-r104-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r104-real-chromium-home-tool-library-screenshots
          path: qa-artifacts/r104-ui/
          retention-days: 30
          if-no-files-found: warn
