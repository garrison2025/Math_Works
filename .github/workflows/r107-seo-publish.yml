name: R108 production SEO quality and public index release
on:
  pull_request:
    paths:
      - 'src/lib/publication.ts'
      - 'src/data/topic-seo.ts'
      - 'src/components/SubjectGuide.astro'
      - 'src/components/GeoTopicAnswers.astro'
      - 'src/lib/geo-answer-guides.ts'
      - 'tests/r111-geo-evidence.test.mjs'
      - 'scripts/qa-r111-geo-built.mjs'
      - 'src/components/SkillComparison.astro'
      - 'src/pages/**'
      - 'src/components/Layout.astro'
      - 'src/pages/sitemap.xml.ts'
      - 'astro.config.mjs'
      - 'public/robots.txt'
      - 'public/_redirects'
      - 'src/data/routes.json'
      - 'tests/r109-seo-consolidation.test.mjs'
      - 'scripts/qa-r107-index-built.mjs'
      - 'scripts/qa-r109-internal-links.mjs'
      - 'tests/r108-seo-meta.test.mjs'
      - 'scripts/qa-r108-lab-speed.mjs'
      - 'tests/r107-publication.test.mjs'
      - '.github/workflows/r107-seo-publish.yml'
  push:
    branches: [main]
    paths:
      - 'public/_redirects'
      - 'src/data/routes.json'
      - 'tests/r109-seo-consolidation.test.mjs'
      - 'src/lib/publication.ts'
      - 'src/components/Layout.astro'
      - 'src/pages/sitemap.xml.ts'
      - 'astro.config.mjs'
      - 'public/robots.txt'
      - 'scripts/qa-r107-index-built.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-index-release:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - name: Simulate main and preview publication contract
        run: node --experimental-strip-types --test tests/r107-publication.test.mjs
      - name: Check legacy URL consolidation and frozen keyword metric provenance
        run: node --experimental-strip-types --test tests/r109-seo-consolidation.test.mjs
      - name: Check all 51 exact-intent metadata entries
        run: node --experimental-strip-types --test tests/r108-seo-meta.test.mjs
      - name: Check ten original GEO answer guides and editorial integrity
        run: node --experimental-strip-types --test tests/r111-geo-evidence.test.mjs
      - name: Build Cloudflare production with stale Cloudflare PUBLIC_INDEXABLE=false
        env:
          CF_PAGES_BRANCH: main
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_SITE_URL: https://math-works.pages.dev
        run: npm run build
      - name: Inspect all 64 HTML pages, 64 canonical sitemap URLs, OG and topic-specific metadata
        run: node scripts/qa-r107-index-built.mjs
      - name: Audit all 64 pages for broken internal links, fragments and orphan pages
        run: node scripts/qa-r109-internal-links.mjs
      - name: Verify rendered original GEO answers and public quality-method pages
        run: node --experimental-strip-types scripts/qa-r111-geo-built.mjs
      - name: Record reproducible mobile Chrome FCP/LCP/CLS lab metrics (not CrUX)
        run: node scripts/qa-r108-lab-speed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r108-64-indexable-pages-and-unique-meta-proof
          path: qa-artifacts/r108-seo/
          retention-days: 30
          if-no-files-found: warn
