name: R107 public SEO owner launch QA
on:
  pull_request:
    paths:
      - 'src/lib/publication.ts'
      - 'src/components/Layout.astro'
      - 'src/pages/sitemap.xml.ts'
      - 'astro.config.mjs'
      - 'public/robots.txt'
      - 'scripts/qa-r107-index-built.mjs'
      - 'tests/r107-publication.test.mjs'
      - '.github/workflows/r107-seo-publish.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/publication.ts'
      - 'src/components/Layout.astro'
      - 'src/pages/sitemap.xml.ts'
      - 'astro.config.mjs'
      - 'public/robots.txt'
      - 'scripts/qa-r107-index-built.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-index-release:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - name: Simulate main and preview publication contract
        run: node --experimental-strip-types --test tests/r107-publication.test.mjs
      - name: Build Cloudflare production with stale Cloudflare PUBLIC_INDEXABLE=false
        env:
          CF_PAGES_BRANCH: main
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_SITE_URL: https://math-works.pages.dev
        run: npm run build
      - name: Inspect actual 57 indexable HTML pages and exact canonical sitemap
        run: node scripts/qa-r107-index-built.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r107-57-public-canonical-pages-proof
          path: qa-artifacts/r107-index/
          retention-days: 30
          if-no-files-found: warn
