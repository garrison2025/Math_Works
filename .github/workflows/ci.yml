name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run test:pdf
      - run: npm run build
      - run: npm run audit:static
      - name: R62 export complete source-grounded keyword intent and SEO release status
        run: npm run qa:seo-readiness
      - name: R63 inspect all 488 original keywords against exact 145 source-backed intent flags
        run: npm run qa:seo-triage
      - name: R73 export actual 488-keyword coverage after all R66-R73 features
        run: npm run qa:seo-progress
      - name: R74 export current 488 keyword coverage with verified inequality and circle area work
        run: npm run qa:seo-progress-r74
      - name: R75 export exact 488 keyword coverage after triangle theorem and real L-shaped area
        run: npm run qa:seo-progress-r75
      - name: Archive R75 source-grounded 488 keyword coverage and 99 unresolved historical flags
        uses: actions/upload-artifact@v4
        with:
          name: r75-488-keyword-true-coverage
          path: qa-artifacts/r75-488-keyword-current-coverage/
          retention-days: 30
          if-no-files-found: error
      - name: Archive R74 current evidence-grounded keyword coverage
        uses: actions/upload-artifact@v4
        with:
          name: r74-488-keyword-true-coverage
          path: qa-artifacts/r74-488-keyword-current-coverage/
          retention-days: 30
          if-no-files-found: error
      - name: Archive R73 source-grounded 488-keyword current coverage and unresolved intents
        uses: actions/upload-artifact@v4
        with:
          name: r73-488-keyword-true-coverage
          path: qa-artifacts/r73-488-keyword-current-coverage/
          retention-days: 30
          if-no-files-found: error
      - name: R70 export corrected 488-keyword routing and 117 remaining intent flags
        run: npm run qa:seo-remap
      - name: Archive R70 reviewed keyword mapping (15 corrected, four ambiguous, original 488 unchanged)
        uses: actions/upload-artifact@v4
        with:
          name: r70-488-keyword-corrected-routing
          path: qa-artifacts/r70-corrected-keyword-routing/
          retention-days: 30
          if-no-files-found: error
      - name: R64 export eight named public competitor page observations and 1-12 chart capability status
        run: npm run qa:serp-r64
      - name: Archive R64 public competitor comparisons with honest SERP limits
        uses: actions/upload-artifact@v4
        with:
          name: r64-competitor-page-evidence
          path: qa-artifacts/r64-live-competitor-readiness/
          retention-days: 30
          if-no-files-found: error
      - name: Archive R63 SEO triage for 488 keywords, 145 issues and route proposals
        uses: actions/upload-artifact@v4
        with:
          name: r63-full-keyword-intent-matrix
          path: qa-artifacts/r63-seo-intent-triage/
          retention-days: 30
          if-no-files-found: error
      - name: Archive R62 488-row SEO keyword intent and launch gate report
        uses: actions/upload-artifact@v4
        with:
          name: r62-source-keyword-intent-audit
          path: qa-artifacts/r62-seo-readiness/
          retention-days: 30
          if-no-files-found: error
      - name: Archive built pages for offline browser QA
        uses: actions/upload-artifact@v4
        with:
          name: math-works-built-site
          path: dist/
          retention-days: 3
          if-no-files-found: error
      - name: Chromium end-to-end worksheet downloads and mobile checks
        run: npm run qa:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-works-browser-qa
          path: qa-artifacts/browser/
          retention-days: 7
          if-no-files-found: warn
      - name: Generate PDF golden fixtures
        run: npm run qa:pdf-samples
      - name: Stress test all 51 live worksheet PDFs at maximum count
        run: npm run qa:pdf-stress
      - name: R54 export paired A4 and Letter writing-room PDF fixtures
        run: npm run qa:writing-room
      - name: R56 export seeded A4 and Letter volume and surface-area prism PDFs
        run: npm run qa:prism-dimensions
      - name: R57 export A4 and Letter origin-anchored Cartesian PDF diagrams
        run: npm run qa:cartesian-ticks
      - name: R58 export 16 A4/Letter student and answer box-scale PDFs
        run: npm run qa:stat-chart-pdfs
      - name: R59 export 18 A4/Letter scatter trends, blank grids and solved PDF charts
        run: npm run qa:scatter-chart-pdfs
      - name: R59 export 24 A4/Letter counting-dot true-vector PDFs for values 1 through 12
        run: npm run qa:counting-dot-pdfs
      - name: R60 export 38 A4/Letter teacher-key and student 40-question PDF fixtures
        run: npm run qa:teacher-keys
      - name: R73 export 30 true division story student, teacher and worked-step PDFs
        run: npm run qa:division-stories
      - name: R74 export 66 true A4/Letter inequality and circle sector practice PDFs
        run: npm run qa:r74-math
      - name: R75 export 42 real true-vector triangle inequality and composite L area PDFs
        run: npm run qa:r75-geometry
      - name: R72 export 8 true printable A4/Letter equal-width fraction strip charts
        run: npm run qa:fraction-strips-r72
      - name: R71 export 30 true area-model, fact-family and mixed facts A4/Letter PDFs
        run: npm run qa:multdiv-r71
      - name: R69 export 54 real A4/Letter printable exact fraction-decimal conversion PDFs
        run: npm run qa:fraction-decimal
      - name: R68 export 36 real A4/Letter aligned decimal column add/sub worksheets
        run: npm run qa:decimal-add-sub
      - name: R67 export 24 exact decimal division student, teacher and worked-step PDFs
        run: npm run qa:decimal-division
      - name: R66 export 32 physical A4/Letter fraction number-line student and teacher PDFs
        run: npm run qa:fraction-line-pdfs
      - name: R65 export 24 exact fraction and decimal one-step and two-step PDF packs
        run: npm run qa:equation-packs
      - name: R64 export four separate Letter and A4 blank and filled multiplication charts
        run: npm run qa:multiplication-grid
      - name: R61 export 90 geometry practice, extra-room and teacher-control A4/Letter PDFs
        run: npm run qa:geometry-writing-room
      - name: Export Letter and A4 blank actual-size protractor PDFs
        run: npm run qa:protractor-instruments
      - name: Export Letter and A4 universal printer calibration PDFs
        run: npm run qa:print-calibration
      - name: Ensure Poppler PDF text geometry reader is available
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Enforce 36-point text-safe printable margins on every stress PDF
        run: python3 scripts/check-pdf-margins.py qa-artifacts/pdf-stress
      - name: Install isolated vector-PDF inspector (PyMuPDF pinned)
        shell: bash
        run: |
          python3 -m venv .venv-pdf-audit
          .venv-pdf-audit/bin/python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.7'
      - name: R73 independently read all printed word problems, interpreted remainders and answers
        run: .venv-pdf-audit/bin/python scripts/check-division-word-problems-r73.py qa-artifacts/r73-division-word-problems
      - name: R74 independently recheck all 66 real PDFs for exact math, answer isolation and safe margins
        run: .venv-pdf-audit/bin/python scripts/check-r74-math.py qa-artifacts/r74-inequality-circle
      - name: R75 independently remeasure 42 PDF geometry vectors and recompute polygon area
        run: .venv-pdf-audit/bin/python scripts/check-r75-geometry.py qa-artifacts/r75-triangle-composite
      - name: Archive R75 42 original triangle and composite area PDF artifacts with independent stroke audit
        uses: actions/upload-artifact@v4
        with:
          name: r75-triangle-composite-vector-pdfs
          path: qa-artifacts/r75-triangle-composite/
          retention-days: 21
          if-no-files-found: error
      - name: Archive R74 mathematically audited inequality/circle/sector student and teacher PDFs
        uses: actions/upload-artifact@v4
        with:
          name: r74-inequality-circle-area-pdfs
          path: qa-artifacts/r74-inequality-circle/
          retention-days: 21
          if-no-files-found: error
      - name: Archive R73 word problems and independent contextual remainder audit
        uses: actions/upload-artifact@v4
        with:
          name: r73-division-word-problem-pdfs
          path: qa-artifacts/r73-division-word-problems/
          retention-days: 21
          if-no-files-found: error
      - name: R72 independently inspect all fraction strip PDF vector partitions and teacher labels
        run: .venv-pdf-audit/bin/python scripts/check-fraction-strips-r72.py qa-artifacts/r72-fraction-strips
      - name: Archive R72 blank coloring strips, labelled teacher charts and true vector geometry report
        uses: actions/upload-artifact@v4
        with:
          name: r72-real-fraction-strips-pdfs
          path: qa-artifacts/r72-fraction-strips/
          retention-days: 21
          if-no-files-found: error
      - name: R71 independently check printed partial-product rectangles and inverse fact-family math
        run: .venv-pdf-audit/bin/python scripts/check-multiplication-division-r71.py qa-artifacts/r71-multiplication-division
      - name: Archive R71 real mixed, fact-family and area-model printable PDFs and math geometry audit
        uses: actions/upload-artifact@v4
        with:
          name: r71-multiplication-division-practice-pdfs
          path: qa-artifacts/r71-multiplication-division/
          retention-days: 21
          if-no-files-found: error
      - name: R69 independently inspect real PDF fraction bars, exact answers and reduced fractions
        run: .venv-pdf-audit/bin/python scripts/check-fraction-decimal-r69.py qa-artifacts/r69-fraction-decimal-conversion
      - name: Archive R69 real fraction/decimal conversion PDFs and independent math audit
        uses: actions/upload-artifact@v4
        with:
          name: r69-fraction-decimal-conversion-pdfs
          path: qa-artifacts/r69-fraction-decimal-conversion/
          retention-days: 21
          if-no-files-found: error
      - name: R68 independently check exact printed sums, carries, dot alignment and student answer isolation
        run: .venv-pdf-audit/bin/python scripts/check-decimal-add-sub-r68.py qa-artifacts/r68-decimal-add-sub
      - name: Archive R68 36 column decimal arithmetic PDF fixtures and independent placement audit
        uses: actions/upload-artifact@v4
        with:
          name: r68-exact-decimal-column-worksheets
          path: qa-artifacts/r68-decimal-add-sub/
          retention-days: 21
          if-no-files-found: error
      - name: R67 independently recalculate printed decimal quotients and inspect student answer isolation
        run: .venv-pdf-audit/bin/python scripts/check-decimal-division-r67.py qa-artifacts/r67-decimal-division
      - name: Archive R67 exact decimal division student, answer and worked-step PDFs with audit
        uses: actions/upload-artifact@v4
        with:
          name: r67-exact-decimal-division-pdfs
          path: qa-artifacts/r67-decimal-division/
          retention-days: 21
          if-no-files-found: error
      - name: R66 independently check fraction tick spacing, plotted dots and student answer isolation
        run: .venv-pdf-audit/bin/python scripts/check-fraction-number-lines-r66.py qa-artifacts/r66-fraction-number-lines
      - name: Archive R66 real fraction number-line PDFs and independent vector geometry audit
        uses: actions/upload-artifact@v4
        with:
          name: r66-fraction-number-line-vector-pdfs
          path: qa-artifacts/r66-fraction-number-lines/
          retention-days: 21
          if-no-files-found: error
      - name: R65 independently verify real student question PDFs and math-checked answer keys
        run: .venv-pdf-audit/bin/python scripts/check-equation-packs-r65.py qa-artifacts/r65-equation-packs
      - name: Archive R65 24 original equation practice answer and worked solution PDFs
        uses: actions/upload-artifact@v4
        with:
          name: r65-exact-equation-practice-pdfs
          path: qa-artifacts/r65-equation-packs/
          retention-days: 21
          if-no-files-found: error
      - name: R64 independently check 676 real PDF table squares and 288 teacher products
        run: .venv-pdf-audit/bin/python scripts/check-multiplication-grid.py qa-artifacts/r64-multiplication-grid
      - name: Archive R64 exact 1-12 multiplication chart PDFs and independent math geometry audit
        uses: actions/upload-artifact@v4
        with:
          name: r64-real-printed-multiplication-charts
          path: qa-artifacts/r64-multiplication-grid/
          retention-days: 21
          if-no-files-found: error
      - name: Enforce 36-point vector-drawing safe margins on every stress PDF
        run: .venv-pdf-audit/bin/python scripts/check-pdf-vector-margins.py qa-artifacts/pdf-stress
      - name: R54 verify student pencil rules from actual PDF drawing operators
        run: .venv-pdf-audit/bin/python scripts/check-writing-room-vectors.py qa-artifacts/r54-writing-room
      - name: R52 adversarial tests for actual exported print calibration geometry
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_print_calibration_audit.py' -v
      - name: R52 check real PDF 100 mm X/Y and 50 mm vector segments
        run: .venv-pdf-audit/bin/python scripts/check-print-calibration.py qa-artifacts/print-calibration
      - name: R43 reject ambiguous PDF math labels (adversarial tests)
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_diagram_glyphs.py' -v
      - name: R43 check printed degree and multiplication glyphs in every relevant stress PDF
        run: .venv-pdf-audit/bin/python scripts/check-pdf-diagram-glyphs.py qa-artifacts/pdf-stress
      - name: R53 adversarial tests for true-PDF long division work guides
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_long_division_guides.py' -v
      - name: R53 check true-PDF guide rows against all 160 printed division questions
        run: .venv-pdf-audit/bin/python scripts/check-pdf-long-division-guides.py qa-artifacts/pdf-stress
      - name: R57 adversarial tests for symmetric Cartesian PDF tick vectors
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_cartesian_ticks.py' -v
      - name: R57 independently audit actual PDF Cartesian axis origins and tick positions
        run: .venv-pdf-audit/bin/python scripts/check-pdf-cartesian-ticks.py qa-artifacts/cartesian-ticks
      - name: R58 independently audit true-PDF box tick labels, quartiles and outliers
        run: .venv-pdf-audit/bin/python scripts/check-pdf-box-scales.py qa-artifacts/stat-chart-pdfs
      - name: R59 adversarial PDF scatter coordinate and answer oracle tests
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_scatter_vectors.py' -v
      - name: 'R59 inspect 18 true scatter PDFs: axes, tick numbers, six point positions and answer isolation'
        run: .venv-pdf-audit/bin/python scripts/check-pdf-scatter-vectors.py qa-artifacts/scatter-chart-pdfs
      - name: R59 adversarial unit tests for PDF counting-dot positions and missing dots
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_counting_dots.py' -v
      - name: R59 inspect 24 actual counting-dot PDFs and all values from 1 through 12
        run: .venv-pdf-audit/bin/python scripts/check-pdf-counting-dots.py qa-artifacts/counting-dot-pdfs
      - name: R60 independently inspect 38 teacher and student PDFs for layout gutters and exact answer counts
        run: .venv-pdf-audit/bin/python scripts/check-teacher-key-pdfs.py qa-artifacts/r60-teacher-key
      - name: R61 adversarial tests reject missing, overlapping and misplaced geometry pencil lines
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_geometry_writing_space.py' -v
      - name: R61 check true PDF geometry pencil vectors below every drawing and absent from teacher keys
        run: .venv-pdf-audit/bin/python scripts/check-geometry-writing-space.py qa-artifacts/r61-geometry-writing-space
      - name: R56 audit true-PDF prism L/W/H labels, positions and missing heights
        run: .venv-pdf-audit/bin/python scripts/check-pdf-prism-dimensions.py qa-artifacts/prism-dimensions
      - name: R55 independently audit printed perpendicular-height right-angle squares
        run: .venv-pdf-audit/bin/python scripts/check-pdf-altitude-markers.py qa-artifacts/pdf-stress
      - name: R44 adversarial tests for real PDF trapezoid base ordering
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_trapezoid_audit.py' -v
      - name: R44 verify physical PDF top/bottom bases against exact generated questions
        run: .venv-pdf-audit/bin/python scripts/check-pdf-trapezoid.py qa-artifacts/pdf-stress
      - name: Reject missing or text-obscured fraction bars (adversarial tests)
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_fractions_audit.py' -v
      - name: Verify every visually typeset fraction has its exact PDF vector bar
        run: .venv-pdf-audit/bin/python scripts/check-pdf-fractions.py qa-artifacts/pdf-stress
      - name: Reject missing PDF questions answers steps and tampered bytes (adversarial tests)
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_content_audit.py' -v
      - name: Verify extracted content of every stress PDF against exact problem manifest
        run: .venv-pdf-audit/bin/python scripts/check-pdf-content.py qa-artifacts/pdf-stress
      - name: Reject clipped glyphs and severe overlapping PDF text (adversarial tests)
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_pdf_visual_audit.py' -v
      - name: Check every PDF page for text collisions and generate human review boards
        run: .venv-pdf-audit/bin/python scripts/check-pdf-visual.py qa-artifacts/pdf-stress
      - name: Test physical-PDF dimension audit against intentionally broken instruments
        run: .venv-pdf-audit/bin/python -m unittest discover -s tests -p 'test_protractor_geometry_audit.py' -v
      - name: Verify actual 50 mm ruler and 72 mm radius in every exported protractor PDF
        run: .venv-pdf-audit/bin/python scripts/check-protractor-geometry.py qa-artifacts/pdf-stress qa-artifacts/protractor-instruments
      - name: Archive R61 geometry computation and writing room PDF evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r61-geometry-writing-pdfs
          path: qa-artifacts/r61-geometry-writing-space/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R60 40-question teacher keys and independent vector report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r60-teacher-key-print-layout
          path: qa-artifacts/r60-teacher-key/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R59 PDF counting-dot answers and vector audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r59-counting-dots-pdf-vectors
          path: qa-artifacts/counting-dot-pdfs/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R59 scatter PDF vector samples and audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r59-scatter-pdf-vectors
          path: qa-artifacts/scatter-chart-pdfs/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R58 statistical box scale PDF evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r58-printed-box-scales
          path: qa-artifacts/stat-chart-pdfs/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R57 Cartesian zero-centered A4/Letter sample PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r57-cartesian-zero-centered
          path: qa-artifacts/cartesian-ticks/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R56 prism and cube actual PDF label review samples
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r56-prism-dimensions
          path: qa-artifacts/prism-dimensions/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R54 extra writing-room reference PDFs and vector audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r54-writing-room-paper-pdfs
          path: qa-artifacts/r54-writing-room/
          retention-days: 14
          if-no-files-found: error
      - name: Archive R52 printable calibration sheets and independently checked geometry
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-printer-scale-check
          path: qa-artifacts/print-calibration/
          retention-days: 14
          if-no-files-found: error
      - name: Archive blank Letter and A4 calibrated protractors with geometry report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-physical-protractor-geometry
          path: qa-artifacts/protractor-instruments/
          retention-days: 14
          if-no-files-found: error
      - name: Retain exhaustive PDF audit and exact problem/answer manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-all-51-topic-pdf-stress
          path: qa-artifacts/pdf-stress/
          retention-days: 7
          if-no-files-found: error
      - name: Render first pages for visual review (when Poppler is available)
        shell: bash
        run: |
          if command -v pdftoppm >/dev/null 2>&1; then
            for file in qa-artifacts/pdf-samples/*-questions.pdf; do
              pdftoppm -f 1 -l 1 -singlefile -r 110 -png "$file" "${file%.pdf}"
            done
          else
            echo 'NOT RUN: pdftoppm is unavailable; inspect PDF artifacts manually.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-math-worksheet-golden-pdfs
          path: qa-artifacts/pdf-samples/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify preview is not indexable
        run: |
          grep -q 'noindex,nofollow' dist/index.html
          test -f dist/two-step-equations-worksheets/index.html
          test -f dist/images/worksheets/two-step-equations-worksheets-sample.webp

  firefox-qa:
    # A missing/unreachable browser runtime must not block all other release evidence.
    # Firefox remains a required, separately reported job and never silently passes.
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: math-works-built-site
          path: dist/
      - name: Install Playwright Firefox browser
        timeout-minutes: 7
        run: npx playwright-core install firefox
      - name: Firefox PDF download and mobile QA
        timeout-minutes: 5
        run: npm run qa:firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-works-firefox-qa
          path: qa-artifacts/firefox/
          retention-days: 7
          if-no-files-found: warn
