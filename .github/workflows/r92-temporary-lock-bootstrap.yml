name: R92 temporary package-lock bootstrap
on:
  push:
    branches:
      - chore/r92-lockfile-ci
permissions:
  contents: write
jobs:
  bootstrap-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile only if absent
        run: |
          if test -f package-lock.json; then
            echo 'Existing package-lock detected; no action.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(l.lockfileVersion!==3||l.packages[''].name!==p.name)process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "R92: commit npm dependency lock generated by Node 22 runner"
          git push origin HEAD:chore/r92-lockfile-ci
